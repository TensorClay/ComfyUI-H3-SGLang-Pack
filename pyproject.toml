[project]
name = "h3-sglang-pack"
version = "1.0.1"
description = "Add proper multi-GPU support to your MiniMax H3 workflows with these drop-in replacements for common nodes, that unlock parallel processing via SGLang."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
authors = [
    { name = "TensorClay" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/TensorClay/ComfyUI-H3-SGLang-Pack"
Documentation = "https://github.com/TensorClay/ComfyUI-H3-SGLang-Pack#readme"
"Bug Tracker" = "https://github.com/TensorClay/ComfyUI-H3-SGLang-Pack/issues"

[tool.comfy]
PublisherId = "tensorclay"
DisplayName = "H3 SGLang Pack"
Icon = "https://avatars.githubusercontent.com/u/317162298?s=400&v=4"
requires-comfyui = ">=0.32.0"
