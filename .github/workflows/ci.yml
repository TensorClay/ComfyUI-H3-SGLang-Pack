name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Validate Registry metadata
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          assert metadata["project"]["name"] == "h3-sglang-pack"
          assert metadata["tool"]["comfy"]["PublisherId"] == "tensorclay"
          assert "TensorClay/ComfyUI-H3-SGLang-Pack" in metadata["project"]["urls"]["Repository"]
          PY

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Check out minimum supported ComfyUI
        uses: actions/checkout@v6
        with:
          repository: Comfy-Org/ComfyUI
          ref: v0.32.0
          path: .ci/ComfyUI
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .ci/ComfyUI/requirements.txt
      - name: Install CPU PyTorch and ComfyUI requirements
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          python -m pip install -r .ci/ComfyUI/requirements.txt
      - name: Run package unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/ComfyUI
        run: python tests/run_unit_tests.py
